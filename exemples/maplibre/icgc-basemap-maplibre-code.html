  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

  <script>
    // 1. Carregar el codi de l'altre fitxer
    fetch('icgc-basemap-maplibre-map.html')
      .then(response => response.text())
      .then(html => {
        const bloc = document.getElementById('codi-carregat');
        bloc.textContent = html;
        Prism.highlightElement(bloc);
      });

    // 2. Traduir el botó de copiar
    const observador = new MutationObserver(() => {
      document.querySelectorAll('.copy-to-clipboard-button').forEach(btn => {
        if (btn.textContent === 'Copy') btn.textContent = 'Copiar';
        if (btn.textContent === 'Copied!') btn.textContent = 'Copiat!';
      });
    });
    observador.observe(document.body, { childList: true, subtree: true });
  </script>
