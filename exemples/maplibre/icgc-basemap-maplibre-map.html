<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Exemple MapLibre v6 i Mapa base ICGC</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <!-- MapLibre GL JS v6 -->
    <link href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Bootstrap -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        #menu {
            position: absolute;
            z-index: 1000;
            background: #fff;
            padding: 10px;
            font-family: "Open Sans", sans-serif;
            top: 5px;
            left: 5px;
            border-radius: 7px;
            -webkit-box-shadow:
                5px 5px 5px -5px rgba(0, 0, 0, 0.75);
            -moz-box-shadow:
                5px 5px 5px -5px rgba(0, 0, 0, 0.75);
            box-shadow:
                5px 5px 5px -5px rgba(0, 0, 0, 0.75);
        }
        #div_pitch {
            position: absolute;
            right: 10px;
            top: 142px;
            width: 30px;
            z-index: 100;
        }
        .sliderClass {
            position: absolute;
            left: 10px;
            top: 79px;
            width: 130px;
            z-index: 100;
            display: none;
            background-color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="menu">
        <input id="mapa-base-estandard" type="radio" name="rtoggle" value="mapa-base-estandard" checked>
        <label for="mapa-base-estandard">
            Mapa estàndard
        </label>
        <br>
        <input id="mapa-base-estandard-gris" type="radio" name="rtoggle" value="mapa-base-estandard-gris">
        <label for="mapa-base-estandard-gris">
            Mapa base gris
        </label>
        <br>
        <input id="mapa-base-topografic" type="radio" name="rtoggle" value="mapa-base-topografic">
        <label for="mapa-base-topografic">
            Topogràfic
        </label>
        <br>
        <input id="mapa-base-orto" type="radio" name="rtoggle" value="mapa-base-orto">
        <label for="mapa-base-orto">
            Ortofoto
        </label>
        <br>
        <input id="mapa-base-orto-gris" type="radio" name="rtoggle" value="mapa-base-orto-gris">
        <label for="mapa-base-orto-gris">
            Ortofoto gris
        </label>
        <br>
        <input id="mapa-base-orto-hibrida" type="radio" name="rtoggle" value="mapa-base-orto-hibrida">
        <label for="mapa-base-orto-hibrida">
            Orto híbrida
        </label>
    </div>
    <div id="div_pitch" class="mapboxgl-ctrl-group mapboxgl-ctrl">
        <button id="bt_pitch" title="Perspectiva" class="mapboxgl-ctrl-icon glyphicon glyphicon-road"></button>
    </div>
    <div id="map"></div>
    <!--
        MapLibre GL JS v6
        A partir de v6 s'ha de carregar com a ES module.
    -->
    <script type="module">
        import * as maplibregl from
            "https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs";
        
        const map = new maplibregl.Map({
            container: "map",
            style:
                "https://geoserveis.icgc.cat/styles/mapa-base-estandard.json",
            center: [1.1464, 41.706],
            zoom: 7.4,
            maxZoom: 18,
            hash: true,
            pitch: 0,
            attributionControl: false
        });
        /*
         * Controls
         */
        map.on("load", () => {
            map.addControl(
                new maplibregl.NavigationControl()
            );
            map.addControl(
                new maplibregl.AttributionControl({
                    compact: true
                })
            );
            map.addControl(
                new maplibregl.GeolocateControl({
                    positionOptions: {
                        enableHighAccuracy: true
                    },
                    trackUserLocation: true,
                    showUserHeading: true
                })
            );
        });
        /*
         * Canvi de mapa base
         */
        const layerList =
            document.getElementById("menu");
        const inputs =
            layerList.getElementsByTagName("input");
        function switchLayer(event) {
            const layerId = event.target.id;
            const styleUrl =
                "https://geoserveis.icgc.cat/styles/" +
                layerId +
                ".json";
            map.setStyle(styleUrl);
        }
        /*
         * Canvi de perspectiva
         */
        const button =
            document.getElementById("bt_pitch");
        function canviaPerspectiva() {
            let pitch = map.getPitch();
            if (pitch >= 60) {
                pitch = 0;
            } else {
                pitch += 30;
            }
            map.easeTo({
                pitch: pitch
            });
        }
        /*
         * Events dels radio buttons
         */
        for (let i = 0; i < inputs.length; i++) {
            inputs[i].addEventListener(
                "click",
                switchLayer
            );
        }
        /*
         * Botó perspectiva
         */
        button.addEventListener(
            "click",
            canviaPerspectiva
        );
    </script>
</body>
</html>
